<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Álcool ou Gasolina</title>

  <!-- Viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Estilo -->
  <link rel="stylesheet" href="style.css">

  <!-- Manifest PWA -->
  <link rel="manifest" href="manifest.json">

  <!-- iOS PWA (OBRIGATÓRIO) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Álcool ou Gasolina">

  <!-- ÍCONE ÚNICO (500x500) -->
  <link rel="apple-touch-icon" href="icon.png">

  <!-- Tema -->
  <meta name="theme-color" content="#1b5e20">
</head>
<body>

<!-- ================= TELA INICIAL ================= -->
<div class="container" id="telaInicial">
  <div class="card">
    <h1>Álcool ou Gasolina</h1>
    <p>
      Descubra qual combustível é mais vantajoso com base
      no <strong>custo real por quilômetro (R$/km)</strong>.
    </p>
    <button onclick="irParaCalculadora()">Começar</button>
  </div>
</div>

<!-- ================= TELA CALCULADORA ================= -->
<div class="container hidden" id="telaCalculadora">

  <div class="card">
    <h1>Calculadora</h1>

    <label>Preço do Álcool (R$)</label>
    <input type="number" id="alcool" step="0.01" placeholder="Ex: 4.29">

    <label>Consumo com Álcool (km/l)</label>
    <input type="number" id="consumoAlcool" step="0.1" placeholder="Ex: 7.5">

    <label>Preço da Gasolina (R$)</label>
    <input type="number" id="gasolina" step="0.01" placeholder="Ex: 6.19">

    <label>Consumo com Gasolina (km/l)</label>
    <input type="number" id="consumoGasolina" step="0.1" placeholder="Ex: 10.2">

    <button onclick="calcular()">Calcular</button>
    <button class="secondary" onclick="abrirHistorico()">📜 Histórico</button>
  </div>

  <div id="resultado" class="card"></div>

</div>

<!-- ================= TELA HISTÓRICO ================= -->
<div class="container hidden" id="telaHistorico">
  <div class="card">
    <h1>Histórico</h1>
    <ul id="listaHistorico"></ul>

    <button onclick="limparHistorico()">🗑 Limpar Histórico</button>
    <button class="secondary" onclick="voltarCalculadora()">Voltar</button>
  </div>
</div>

<!-- ================= SCRIPTS ================= -->
<script src="script.js"></script>

<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
  }
</script>

</body>
</html>
